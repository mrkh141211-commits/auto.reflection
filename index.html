<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日の種 — リフレクション → note</title>
<style>
  :root { --paper:#eef1ef; --paper-raised:#f6f7f5; --ink:#1e2a28; --ink-soft:#55635f;
    --pine:#2e5a54; --pine-deep:#234641; --line:#d5dbd7; --leaf:#7a8b6f; --straw:#b0a98f; --shadow:rgba(35,70,65,.10); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:660px; margin:0 auto; padding:32px 22px 120px; }
  h1 { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-weight:600; font-size:26px; margin:4px 0 2px; }
  .eyebrow { font-size:12.5px; color:var(--ink-soft); }
  .lede { color:var(--ink-soft); font-size:14.5px; margin:14px 0 18px; } .lede b { color:var(--pine); }
  .state { text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .state .big { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:19px; color:var(--ink); margin-bottom:8px; }

  .gate { text-align:center; padding:70px 20px; }
  .gate input { font-family:inherit; font-size:15px; padding:11px 16px; border:1px solid var(--line); border-radius:8px; width:220px; text-align:center; }
  .gate input:focus { outline:none; border-color:var(--pine); box-shadow:inset 0 0 0 1px var(--pine); }
  .gate .msg { color:#a4443a; font-size:13px; margin-top:10px; height:16px; }

  .topic { background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:8px; padding:14px 16px; margin-bottom:12px; cursor:pointer; transition:.15s; }
  .topic:hover { border-color:#c3ccc7; }
  .topic.selected { background:var(--pine); border-color:var(--pine-deep); border-left-color:var(--pine-deep); color:#f2f5f3; }
  .topic.selected .summary { color:#cfe0da; }
  .t-head { display:flex; align-items:center; gap:10px; }
  .rich { flex:none; font-size:11.5px; padding:2px 9px; border-radius:999px; color:#fff; }
  .rich.濃{background:var(--pine);} .rich.中{background:var(--leaf);} .rich.軽{background:#8fa86a;}
  .topic.selected .rich { background:rgba(255,255,255,.22); }
  .title { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:16.5px; font-weight:600; }
  .summary { font-size:13px; color:var(--ink-soft); margin:6px 0 0; }

  .article-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .atab { font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--paper-raised); cursor:pointer; color:var(--ink-soft); }
  .atab.active { background:var(--pine); color:#f2f5f3; border-color:var(--pine); }
  .nav { display:flex; gap:8px; margin:2px 0 20px; }
  .article { background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:24px 26px; }
  .article h2 { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:20px; font-weight:600; margin:0 0 14px; line-height:1.4; }
  .article p { font-size:14.5px; margin:0 0 12px; }

  .ig-wrap { margin-top:28px; }
  .ig-label { font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; }
  .ig-card { position:relative; width:300px; height:300px; overflow:hidden; --accent:var(--pine-deep); --accent-soft:rgba(35,70,65,.12);
    background:#fbfbf8; color:var(--ink); border-radius:16px;
    padding:30px; display:flex; flex-direction:column; justify-content:center; box-shadow:0 10px 28px rgba(35,70,65,.14); border:1px solid var(--line); }
  .ig-art { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .ig-frame { position:absolute; inset:13px; border:1px solid var(--accent); opacity:.28; border-radius:9px; }
  .ig-quotemark { position:absolute; top:4px; left:20px; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:96px; line-height:1; color:var(--accent); opacity:.16; }
  .ig-card .q { position:relative; z-index:1; outline:none; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; line-height:1.8; font-weight:600; color:var(--ink); }
  .ig-foot { position:relative; z-index:1; margin-top:18px; display:flex; align-items:center; gap:8px; }
  .ig-rule { flex:1; height:1px; background:var(--accent); opacity:.4; }
  .ig-sig { font-size:11.5px; color:var(--accent); font-weight:600; white-space:nowrap; }

  .editor { margin-top:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .ed-row { margin-bottom:14px; } .ed-row:last-child { margin-bottom:0; }
  .ed-label { font-size:12px; color:var(--ink-soft); margin-bottom:7px; }
  .qp { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:7px; padding:8px 12px; margin-bottom:6px;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:13px; color:var(--ink); cursor:pointer; }
  .qp.active { border-color:var(--pine); background:#eaf0ee; color:var(--pine); font-weight:600; box-shadow:inset 3px 0 0 var(--pine); }
  textarea.ed-text, input.ed-input { width:100%; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:14px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:7px; padding:10px 12px; }
  .swatches { display:flex; gap:10px; } .sw { width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .sw.active { border-color:var(--ink); } .sw.active::after { content:"✓"; color:#fff; display:flex; align-items:center; justify-content:center; height:100%; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); }

  button.go, button.ghost { font-family:inherit; font-size:14.5px; font-weight:600; cursor:pointer; padding:11px 20px; border-radius:999px; transition:.15s; }
  button.go { color:#f2f5f3; background:var(--pine); border:none; box-shadow:0 4px 14px var(--shadow); }
  button.go:hover { background:var(--pine-deep); } button.go:disabled { opacity:.4; box-shadow:none; }
  button.ghost { background:transparent; color:var(--pine); border:1px solid var(--pine); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(to top,var(--paper) 72%,rgba(238,241,239,0)); padding:16px 22px 20px; }
  .bar-inner { max-width:660px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .count { flex:1; font-size:13.5px; color:var(--ink-soft); } .count b { color:var(--pine); }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#eef1ef; font-size:13.5px; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; }
  .toast.show { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow" id="dateLabel"></div>
    <h1>今日の種</h1>

    <!-- 合言葉ゲート -->
    <div id="gate" class="gate">
      <p class="lede">合言葉を入れてください。</p>
      <input type="password" id="pass" placeholder="合言葉" autocomplete="off" />
      <div class="msg" id="gateMsg"></div>
      <div style="margin-top:14px;"><button class="go" id="enterBtn">入る</button></div>
    </div>

    <div id="app" style="display:none;"><div class="nav" id="nav"></div><div id="content"></div></div>
  </div>

  <div class="bar" id="bar" style="display:none;">
    <div class="bar-inner"><div class="count" id="count"></div><button class="go" id="action" disabled></button></div>
  </div>
  <div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, orderBy, limit, getDocs, updateDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Firebase 接続情報（おのちゃんのプロジェクト） ──
  const firebaseConfig = {
    apiKey: "AIzaSyBrj2xdJ0VlhF9rogTqJivNHizszKtl3CY",
    authDomain: "auto-reflection-d652a.firebaseapp.com",
    projectId: "auto-reflection-d652a",
    storageBucket: "auto-reflection-d652a.firebasestorage.app",
    messagingSenderId: "520626263754",
    appId: "1:520626263754:web:fb74cedc22c025726c4633",
  };

  // ── 合言葉（★ここをGitHub上で自分の言葉に書き換える。CHANGE_ME を消して好きな言葉に）──
  const PASSCODE = "mrk.h14.12-11";

  const COLLECTION = "topicBatches";
  const RICH_COLOR = {
    "濃":{accent:"#234641",soft:"rgba(35,70,65,.13)"}, "中":{accent:"#5f7a58",soft:"rgba(95,122,88,.14)"},
    "軽":{accent:"#84a35b",soft:"rgba(132,163,91,.16)"}, "藍":{accent:"#2f4858",soft:"rgba(47,72,88,.13)"},
  };

  const app = initializeApp(firebaseConfig);
  const dbf = getFirestore(app);
  const $ = (id) => document.getElementById(id);
  $("dateLabel").textContent = new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});

  // ── 合言葉チェック ──
  $("enterBtn").onclick = tryEnter;
  $("pass").addEventListener("keydown",(e)=>{ if(e.key==="Enter") tryEnter(); });
  function tryEnter() {
    if ($("pass").value === PASSCODE && PASSCODE !== "CHANGE_ME") {
      $("gate").style.display="none"; $("app").style.display="block"; renderNav("current"); showCurrent();
    } else if (PASSCODE === "CHANGE_ME") {
      $("gateMsg").textContent = "合言葉が未設定です（コードのCHANGE_MEを書き換えてください）";
    } else {
      $("gateMsg").textContent = "合言葉がちがいます";
      $("pass").value = "";
    }
  }

  let current = null, archiveRows = [];
  const selected = new Set();

  function renderNav(active){
    const nav=$("nav");
    nav.innerHTML=`<button class="atab${active==="current"?" active":""}" id="navCur">今日の種</button><button class="atab${active==="archive"?" active":""}" id="navArch">これまでの記事</button>`;
    $("navCur").onclick=showCurrent; $("navArch").onclick=showArchive;
  }
  function showCurrent(){ renderNav("current"); selected.clear(); $("bar").style.display="block"; loadBatch(); }
  async function showArchive(){ renderNav("archive"); await renderArchiveList(); }

  async function latest(status) {
    const q = query(collection(dbf, COLLECTION), where("status","==",status), orderBy("createdAt","desc"), limit(1));
    const snap = await getDocs(q);
    return snap.empty ? null : { ref: snap.docs[0].ref, data: snap.docs[0].data() };
  }
  async function loadBatch() {
    try {
      current = await latest("composed") || await latest("selected") || await latest("pending");
      if (!current) return renderEmpty();
      const s = current.data.status;
      if (s === "composed") renderArticles();
      else if (s === "selected") renderWaiting();
      else renderTopics();
    } catch(e) { $("content").innerHTML = `<div class="state"><div class="big">読み込めませんでした</div><small>${esc(e.message)}</small></div>`; }
  }
  function renderEmpty() {
    $("content").innerHTML = `<div class="state"><div class="big">まだ種がありません</div>記録がたまると、ここに書けるテーマが並びます。<br><small style="color:var(--straw);">新しい種は GitHub の「note 候補づくり」を実行すると作れます。</small></div>`;
    $("count").textContent=""; $("action").style.display="none";
  }
  function renderWaiting() {
    $("content").innerHTML = `<div class="state"><div class="big">記事を準備しています</div>種は選べています。GitHub の「note 記事化」を実行すると、数分で記事がここに出ます。<br><small style="color:var(--straw);">できたら、このページを開き直してください。</small></div>`;
    $("count").textContent=""; $("action").style.display="none";
  }
  function renderTopics() {
    const topics = current.data.topics || [];
    let html = `<p class="lede">この数日の記録から、<b>${topics.length}本の種</b>が見つかりました。書きたいものを選んでください。</p>`;
    topics.forEach((t)=>{ html += `<div class="topic" data-id="${t.id}"><div class="t-head"><span class="rich ${t.richness}">${t.richness}</span><span class="title">${esc(t.title)}</span></div><p class="summary">${esc(t.summary)}</p></div>`; });
    $("content").innerHTML = html;
    document.querySelectorAll(".topic").forEach((el)=>{ el.onclick=()=>{ const id=Number(el.dataset.id);
      if(selected.has(id)){selected.delete(id);el.classList.remove("selected");}else{selected.add(id);el.classList.add("selected");}
      const n=selected.size; $("count").innerHTML=n?`<b>${n}本</b>を選択中`:"まだ選んでいません"; $("action").disabled=n===0; $("action").textContent=n?`選んだ${n}本を書く`:"選んで書く"; }; });
    $("count").innerHTML="まだ選んでいません"; $("action").style.display=""; $("action").disabled=true; $("action").textContent="選んで書く";
    $("action").onclick=async()=>{ $("action").disabled=true;
      await updateDoc(current.ref,{selectedIds:[...selected].sort((a,b)=>a-b),status:"selected"});
      $("content").innerHTML=`<div class="state"><div class="big">選びました</div>GitHub の「note 記事化」を実行すると、数分で記事ができます。<br><small style="color:var(--straw);">できたら、このページを開き直してください。</small></div>`;
      $("count").textContent=""; $("action").style.display="none"; };
  }
  function buildArticleUI(arts, opts){
    opts = opts || {}; const start = opts.start || 0;
    $("bar").style.display="block";
    let html = (opts.intro||"")
      + (opts.back?`<div style="margin-bottom:14px;"><button class="atab" id="backBtn">← 一覧に戻る</button></div>`:"")
      + `<div class="article-tabs" id="atabs"></div><div class="article" id="article"></div>
      <div class="ig-wrap"><div class="ig-label">Instagram / note に使うカード（言葉は直接タップして編集できます）</div>
      <div class="ig-card" id="igCard"><svg class="ig-art" id="igArt" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="aw1" cx="80%" cy="16%" r="62%"><stop offset="0" stop-color="currentColor" stop-opacity="0.13"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient><radialGradient id="aw2" cx="18%" cy="92%" r="58%"><stop offset="0" stop-color="currentColor" stop-opacity="0.10"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient></defs><rect width="300" height="300" fill="url(#aw1)"/><rect width="300" height="300" fill="url(#aw2)"/><g stroke="currentColor" fill="none" stroke-linecap="round" opacity="0.2"><path d="M28 254 Q150 234 272 254" stroke-width="1.4"/><path d="M54 268 Q150 254 246 268" stroke-width="1.1"/></g><path d="M150 250 C138 240 138 224 150 214 C162 224 162 240 150 250 Z" fill="currentColor" fill-opacity="0.18"/><path d="M150 250 C150 214 148 192 150 152" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.32"/><g id="igCots" opacity="0.42"><path d="M150 160 C124 152 106 128 104 102 C132 106 150 128 150 158 Z" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.4"/><path d="M150 160 C176 152 194 128 196 102 C168 106 150 128 150 158 Z" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.4"/></g><g fill="currentColor" opacity="0.14"><circle cx="84" cy="66" r="2.2"/><circle cx="222" cy="58" r="1.6"/><circle cx="246" cy="150" r="1.9"/><circle cx="58" cy="152" r="1.5"/></g></svg><div class="ig-frame"></div><div class="ig-quotemark">"</div>
        <div class="q" id="igQuote" contenteditable="true" spellcheck="false"></div>
        <div class="ig-foot"><span class="ig-rule"></span><span class="ig-sig" id="igSig">日々のリフレクションより</span></div></div>
      <div class="editor">
        <div class="ed-row"><div class="ed-label">言葉の候補（タップで入力欄へ）</div><div id="qpList"></div></div>
        <div class="ed-row"><div class="ed-label">カードの言葉</div><textarea class="ed-text" id="edText" rows="2"></textarea></div>
        <div class="ed-row"><div class="ed-label">署名</div><input class="ed-input" id="edSig" value="日々のリフレクションより"></div>
        <div class="ed-row"><div class="ed-label">カードの色</div><div class="swatches" id="swatches"></div></div>
        <div class="ed-row"><label class="toggle"><input type="checkbox" id="edLeaf" checked> 芽のモチーフを表示</label></div>
      </div>
      <div class="ed-row" style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;"><button class="ghost" id="copyBtn">note用の本文をコピー</button><button class="ghost" id="pngBtn">カードを画像で保存</button>`
      + (opts.showDone?`<button class="ghost" id="doneBtn" style="border-color:var(--straw); color:var(--ink-soft);">この記事は完了にする（次の種へ）</button>`:"")
      + `</div></div>`;
    $("content").innerHTML = html;
    const tabs=$("atabs");
    arts.forEach((a,i)=>{ const b=document.createElement("button"); b.className="atab"+(i===start?" active":""); b.textContent=a.title.slice(0,12)+(a.title.length>12?"…":"");
      b.onclick=()=>{showArticle(a);[...tabs.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");}; tabs.appendChild(b); });
    const sw=$("swatches"); ["濃","中","軽","藍"].forEach((k)=>{ const s=document.createElement("div"); s.className="sw"; s.style.background=RICH_COLOR[k].accent; s.dataset.key=k; s.onclick=()=>setColor(k); sw.appendChild(s); });
    $("edText").addEventListener("input",()=>setQuote($("edText").value));
    $("igQuote").addEventListener("input",()=>{$("edText").value=$("igQuote").textContent;setQuote($("igQuote").textContent,true);});
    $("edSig").addEventListener("input",()=>$("igSig").textContent=$("edSig").value||" ");
    $("edLeaf").addEventListener("change",(e)=>{ if($("igCots")) $("igCots").style.display=e.target.checked?"":"none"; });
    $("copyBtn").onclick=()=>{navigator.clipboard.writeText(activeArticle.markdown);toast("本文をコピーしました");};
    $("pngBtn").onclick=()=>{
      const card=$("igCard");
      if(typeof html2canvas==="undefined"){ toast("画像化を読み込めませんでした（通信を確認）"); return; }
      $("igQuote").blur();
      const r0=card.style.borderRadius, s0=card.style.boxShadow;
      card.style.borderRadius="0"; card.style.boxShadow="none";
      html2canvas(card,{scale:1080/card.offsetWidth,backgroundColor:null}).then(cv=>{
        card.style.borderRadius=r0; card.style.boxShadow=s0;
        cv.toBlob(b=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(b);
          a.download=(((activeArticle&&activeArticle.title)||"card").replace(/[\\/:*?"<>|]/g,"").slice(0,40))+".png";
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("画像を保存しました"); });
      }).catch(()=>{ card.style.borderRadius=r0; card.style.boxShadow=s0; toast("保存できませんでした"); });
    };
    if(opts.back) $("backBtn").onclick=()=>showArchive();
    if(opts.showDone) $("doneBtn").onclick=async()=>{
      if(!confirm("この記事を完了にして、次の種に進みます。\nnote本文のコピーと、カードの保存は済みましたか？（完了にしても「これまでの記事」からいつでも見られます）")) return;
      try { await updateDoc(current.ref,{status:"done"}); toast("完了にしました"); showCurrent(); }
      catch(e){ toast("できませんでした"); }
    };
    showArticle(arts[start]);
    $("count").textContent = opts.count || "読んで、本文コピーとカードの仕上げをしてください";
    $("action").style.display=""; $("action").disabled=false; $("action").textContent="カードを保存";
    $("action").onclick=async()=>{ const idx=arts.findIndex(a=>a===activeArticle);
      arts[idx].card={quote:$("igQuote").textContent,sig:$("edSig").value,rich:currentColor,leaf:$("edLeaf").checked};
      try { await updateDoc(current.ref,{articles:arts}); toast("カードを保存しました"); }
      catch(e){ toast("保存できませんでした"); }
    };
  }
  function renderArticles(){
    const arts = current.data.articles || [];
    if(!arts.length) return renderEmpty();
    buildArticleUI(arts,{intro:`<p class="lede">個人名を消して、あなたの教育観と文体で記事にしました。note本文をコピーし、カードを仕上げてください。<b>操作しても記事は消えません。</b></p>`,showDone:true});
  }
  async function renderArchiveList(){
    $("bar").style.display="none";
    $("content").innerHTML=`<div class="state"><div class="big">読み込み中…</div></div>`;
    try{
      const qy=query(collection(dbf,COLLECTION),orderBy("createdAt","desc"),limit(60));
      const snap=await getDocs(qy); const rows=[];
      snap.forEach(d=>{ const data=d.data(); if(data.articles&&data.articles.length) rows.push({ref:d.ref,data}); });
      archiveRows=rows;
      if(!rows.length){ $("content").innerHTML=`<div class="state"><div class="big">まだ記事がありません</div>記事を書くと、ここにたまっていきます。</div>`; return; }
      let html=`<p class="lede">これまでに書いた記事とカードです。タップすると開いて、読み直し・本文コピー・カードの手直しができます。</p>`;
      rows.forEach((r,ri)=>{ const dt=(r.data.createdAt&&r.data.createdAt.toDate)?r.data.createdAt.toDate():null;
        const label=dt?dt.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"}):"";
        r.data.articles.forEach((a,ai)=>{ html+=`<div class="topic arch" data-r="${ri}" data-a="${ai}"><div class="t-head"><span class="title">${esc(a.title)}</span></div><p class="summary">${esc(label)}</p></div>`; });
      });
      $("content").innerHTML=html;
      document.querySelectorAll(".topic.arch").forEach(el=>{ el.onclick=()=>renderArchiveArticle(archiveRows[+el.dataset.r],+el.dataset.a); });
    }catch(e){ $("content").innerHTML=`<div class="state"><div class="big">読み込めませんでした</div><small>${esc(e.message)}</small></div>`; }
  }
  function renderArchiveArticle(r,startIdx){
    current=r;
    buildArticleUI(r.data.articles,{intro:`<p class="lede">保存した記事とカードです。言葉を直したら「カードを保存」で上書きできます。</p>`,showDone:false,back:true,start:startIdx,count:"読み直し・本文コピー・カードの手直しができます"});
  }
  let activeArticle=null,currentColor="濃";
  function showArticle(a){ activeArticle=a;
    $("article").innerHTML=`<h2>${esc(a.title)}</h2>`+a.markdown.split("\n").slice(1).filter(Boolean).map(p=>`<p>${esc(p.replace(/^#+\s*/,""))}</p>`).join("");
    setColor((a.card&&a.card.rich)||a.rich||"濃"); const qp=$("qpList"); qp.innerHTML="";
    (a.quotes||[]).forEach((q,i)=>{ const b=document.createElement("button"); b.className="qp"+(i===0?" active":""); b.textContent=q;
      b.onclick=()=>{$("edText").value=q;setQuote(q);[...qp.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");}; qp.appendChild(b); });
    const first=(a.card&&a.card.quote)||(a.quotes&&a.quotes[0])||""; $("edText").value=first; setQuote(first);
    $("edSig").value=(a.card&&a.card.sig)||"日々のリフレクションより"; $("igSig").textContent=$("edSig").value;
    const showCots=!(a.card&&a.card.leaf===false); if($("edLeaf")) $("edLeaf").checked=showCots; if($("igCots")) $("igCots").style.display=showCots?"":"none"; }
  function setQuote(q,noText){ const el=$("igQuote"); if(!noText) el.textContent=q; const n=(q||"").length; el.style.fontSize=n<=12?"26px":n<=22?"21px":n<=34?"18px":"16px"; }
  function setColor(k){ const c=RICH_COLOR[k]||RICH_COLOR["濃"]; currentColor=k; const card=$("igCard");
    card.style.setProperty("--accent",c.accent); card.style.setProperty("--accent-soft",c.soft);
    const art=$("igArt"); if(art) art.style.color=c.accent;
    document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("active",s.dataset.key===k)); }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);}
</script>
</body>
</html>
